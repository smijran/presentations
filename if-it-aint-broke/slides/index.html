<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>If It Ain't Broke — Slides</title>
    <link rel="stylesheet" href="node_modules/reveal.js/dist/reveal.css" />
    <link rel="stylesheet" href="node_modules/reveal.js/dist/theme/black.css" id="theme" />
    <link rel="stylesheet" href="node_modules/reveal.js/plugin/highlight/monokai.css" />
    <style>
      /* Palette pulled from jdd.org.pl's own stylesheet (dark navy theme, orange primary accent) */
      :root {
        --r-main-font-size: 32px;
        --r-background-color: #030915;
        --r-main-color: #eeebe4;
        --r-heading-color: #eeebe4;
        --r-link-color: #efa831;
        --r-link-color-dark: #c4841f;
        --r-link-color-hover: #f5be5f;
        --r-selection-background-color: rgba(239, 168, 49, 0.75);
      }
      body {
        background: #030915;
      }
      .reveal table {
        font-size: 0.7em;
      }
      .reveal table th,
      .reveal table td {
        border-bottom-color: #273347;
      }
      .reveal .slides section .fragment.demo-note {
        font-size: 0.6em;
        opacity: 0.8;
      }
      .reveal .barchart {
        font-size: 0.5em;
        width: 100%;
        margin: 0 auto;
      }
      .reveal .barchart .bar-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
      }
      .reveal .barchart .bar-label {
        width: 300px;
        flex-shrink: 0;
        text-align: right;
      }
      .reveal .barchart .bar-track {
        background: #111b2b;
        flex-grow: 1;
        height: 30px;
        position: relative;
        border: 1px solid #273347;
      }
      .reveal .barchart .bar-fill {
        background: #efa831;
        height: 100%;
      }
      .reveal .barchart .bar-value {
        width: 80px;
        flex-shrink: 0;
        font-weight: bold;
        color: #efa831;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="slides.md"
                 data-separator="^---$"
                 data-separator-vertical="^--$"
                 data-separator-notes="^:notes:$">
        </section>
      </div>
    </div>

    <script src="node_modules/reveal.js/dist/reveal.js"></script>
    <script src="node_modules/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="node_modules/reveal.js/plugin/highlight/highlight.js"></script>
    <script src="node_modules/reveal.js/plugin/notes/notes.js"></script>
    <script>
      const deck = new Reveal({
        hash: true,
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ],
      });
      deck.initialize();
    </script>
  </body>
</html>
